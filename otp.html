<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأیید کد | تورهای گردشگری</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <div class="logo">🗺️ تورهای گردشگری</div>
        <h2>تأیید کد</h2>
        <p class="subtitle">کد ۶ رقمی را وارد کنید</p>
        
        <form>
            <div class="form-group">
                <label for="otp">کد تأیید:</label>
                <input type="text" id="otp" name="otp" maxlength="6" required class="otp-input">
                <div class="error">کد ۶ رقمی وارد کنید</div>
            </div>
            
            <div class="form-group">
                <label for="new-password">رمز عبور جدید:</label>
                <input type="password" id="new-password" name="new-password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirm-new-password">تکرار رمز جدید:</label>
                <input type="password" id="confirm-new-password" name="confirm-new-password" required>
            </div>
            
            <button type="submit" class="btn">تأیید و تغییر رمز</button>
        </form>
        
        <div class="links">
            <a href="index.html">خانه</a>
            <a href="login.html">ورود</a>
            <a href="forgot-password.html">ارسال مجدد کد</a>
        </div>
    </div>
</body>
</html>
