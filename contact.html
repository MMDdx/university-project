<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">

  <title>تماس با ما — Tourly</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<body class="light">
  <header class="header container"><div class="brand"><div class="logo">T</div><div style="font-weight:700">Tourly</div></div>
    <nav class="nav"><a href="index.html">خانه</a><a href="about.html">درباره ما</a><a href="team.html">تیم ما</a><a href="login.html">ورود</a></nav>
  </header>

  <main class="container">
    <section class="card" style="margin-top:18px">
      <h1>تماس با ما</h1>
      <p class="lead">پیام خود را برای ما ارسال کنید؛ پاسخ سریع دریافت خواهید کرد.</p>

      <form data-simulate>
        <div class="form-message" style="color:var(--md-sys-color-on-surface);margin-bottom:8px"></div>
        <label>نام و نام خانوادگی
          <input type="text" name="name" required>
        </label>
        <label>ایمیل
          <input type="email" name="email" required>
        </label>
        <label>پیام
          <textarea name="message" rows="6" required></textarea>
        </label>
        <button class="btn" type="submit">ارسال پیام</button>
      </form>
    </section>
  </main>

  <footer class="footer">© ۲۰۲۵ Tourly</footer>
  <script src="js/main.js"></script>

</html>
