</head>
<body>
<header>
    <div class="logo-container">
        <a href="#" class="logo">
            <!-- لوگوی JPG به جای SVG -->
            <img src="../assets/logo/logo.png" alt="لوگوی تورهای گردشگری" width="40" height="40" >

        </a>
    </div>
    <nav>
        <ul>
            <li><a class="md-text-medium" href="../index.html">خانه</a></li>
            <li><a  class="md-text-medium" href="../index.html#tours">تورها</a></li>
            <li><a  class="md-text-medium" href="../plans.html">پلن‌های اشتراک</a></li>
            <li><a  class="md-text-medium" href="../about.html">درباره ما</a></li>
            <li><a  class="md-text-medium" href="../team.html">تیم ما</a></li>
            <li><a  class="md-text-medium" href="../contact.html">تماس با ما</a></li>
            <li><a  class="md-text-medium" href="../login.html">ورود</a></li>
            <li><a  class="md-text-medium" href="../signup.html">ثبت نام</a></li>
        </ul>
    </nav>
</header>

    <div class="payment-container">
        <h2>انتخاب روش پرداخت</h2>
        <div class="method-options">
            <div class="method-option md-tonal-medium " id="online" onclick="selectMethod('online')">
                درگاه پرداخت آنلاین
            </div>
            <div class="method-option md-tonal-medium" id="card" onclick="selectMethod('card')">
                کارت به کارت
            </div>
        </div>
        <a href="#" class="btn md-filled-button-small" id="confirm-btn">تأیید و ادامه</a>
    </div>

    <script>
        let selectedMethod = '';
        const urlParams = new URLSearchParams(window.location.search);
        const tour = urlParams.get('tour');
        const quantity = urlParams.get('quantity');
        const total = urlParams.get('total');

        function selectMethod(method) {
            selectedMethod = method;
            document.querySelectorAll('.method-option').forEach(el => el.classList.remove('selected'));
            document.getElementById(method).classList.add('selected');
            const confirmBtn = document.getElementById('confirm-btn');

            confirmBtn.href = `${method === 'online' ? 'online-payment.html' : 'card-to-card.html'}?tour=${tour}&quantity=${quantity}&total=${total}`;
        }
    </script>
<footer>

    </p>
    <p>تلفن: ۰۲۱-۱۲۳۴۵۶۷۸ | ایمیل: info@tourism.com</p>
</footer>
<button class="md-fab-go-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">

</button>
</body>
