<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه پرداخت آنلاین | تورهای گردشگری</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="#" class="logo">
                <!-- لوگوی JPG به جای SVG -->
                <img src="../assets/logo/logo.png" alt="لوگوی تورهای گردشگری" width="40" height="40" style="border-radius: 8px;">
         
            </a>
        </div>
        <nav>
            <ul>
                <li><a class="md-text-medium" href="../index.html">خانه</a></li>
                <li><a  class="md-text-medium" href="../index.html#tours">تورها</a></li>
                <li><a  class="md-text-medium" href="../plans.html">پلن‌های اشتراک</a></li>
                <li><a  class="md-text-medium" href="../about.html">درباره ما</a></li>
                <li><a  class="md-text-medium" href="../team.html">تیم ما</a></li>
                <li><a  class="md-text-medium" href="../contact.html">تماس با ما</a></li>
                <li><a  class="md-text-medium" href="../login.html">ورود</a></li>
                <li><a  class="md-text-medium" href="../signup.html">ثبت نام</a></li>
            </ul>
        </nav>
    </header>

    <div class="payment-container md-card-filled">
        <h2>درگاه پرداخت آنلاین</h2>
        <p>قیمت کل: <span id="total-price"></span> تومان</p>
        <form class="gateway-form">
            <div class="form-group md-text-field-outlined">
                
                <input type="text" id="card-number" placeholder="۱۶ رقمی" required >
                <label for="card-number">شماره کارت:</label>
            </div>
            <div class="form-group md-text-field-outlined">
                
                <input type="text" id="cvv" placeholder="۳ یا ۴ رقمی" required>
                <label for="cvv">CVV2:</label>
            </div>
            <div class="form-group md-text-field-outlined">
                
                <input type="text" id="expire" placeholder="MM/YY" required>
                <label for="expire">تاریخ انقضا:</label>
            </div>
            <button type="submit" class="btn md-filled-button-small md-filled-medium">پرداخت</button>
        </form>
        <p class="subtitle">این یک شبیه‌سازی است. در واقعیت به درگاه بانک متصل می‌شود.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const total = urlParams.get('total');
        document.getElementById('total-price').textContent = parseInt(total).toLocaleString() || '۰';
    </script>
    <footer>
        <p>&copy; ۱۴۰۴ تورهای گردشگری ایران. تمامی حقوق محفوظ است.</p>
        <p><a class="md-outlined-medium" href="../contact.html">تماس با ما</a></p>
    </footer>
    <button class="md-fab-go-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <img class="fab-icon" src="../assets/svg/arrow-up-svgrepo-com.svg">
            
    </button>
</body>

</html>
