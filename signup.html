<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام | تورهای گردشگری</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">خانه</a></li>
                <li><a href="index.html#tours">تورها</a></li>
                <li><a href="about.html">درباره ما</a></li>
                <li><a href="team.html">تیم ما</a></li>
                <li><a href="contact.html">تماس با ما</a></li>
                <li><a href="login.html">ورود</a></li>
                <li><a href="signup.html">ثبت نام</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="logo">🗺️ تورهای گردشگری</div>
        <h2>ثبت نام</h2>
        
        <form>
            <div class="form-group">
                <label for="fullname">نام کامل:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            
            <div class="form-group">
                <label for="email">ایمیل:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">شماره موبایل:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="password">رمز عبور:</label>
                <input type="password" id="password" name="password" required minlength="6">
                <div class="error">حداقل ۶ کاراکتر</div>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">تکرار رمز عبور:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            
            <button type="submit" class="btn">ثبت نام</button>
        </form>
        
        <div class="links">
            <a href="login.html">ورود</a>
            <a href="forgot-password.html">فراموشی رمز عبور</a>
        </div>
    </div>
</body>
</html>
